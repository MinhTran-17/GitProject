<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký người dùng</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #f2f5f9; }
        form { width: 440px; margin: 40px auto; padding: 20px 30px; background: #fff; border: 1px solid #ccd6e0; border-radius: 8px; }
        h2 { text-align: center; color: #1f5fa8; }
        .row { margin-bottom: 14px; }
        .row > label { display: inline-block; width: 120px; font-weight: bold; color: #333; }
        input[type="text"], input[type="email"], input[type="tel"] { width: 280px; padding: 6px; border: 1px solid #aaa; border-radius: 4px; }
        .buttons { text-align: center; margin-top: 20px; }
        .buttons input { padding: 8px 20px; margin: 0 6px; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
        .submit { background: #1f5fa8; }
        .reset { background: #888; }
    </style>
</head>
<body>
    <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
        <h2>Đăng ký người dùng</h2>
        <div class="row">
            <label for="name">Họ và tên:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="row">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="row">
            <label for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <div class="row">
            <label>Giới tính:</label>
            <input type="radio" name="gender" value="male" checked> Nam
            <input type="radio" name="gender" value="female"> Nữ
        </div>
        <div class="buttons">
            <input type="submit" class="submit" value="Đăng ký">
            <input type="reset" class="reset" value="Nhập lại">
        </div>
    </form>
</body>
</html>
