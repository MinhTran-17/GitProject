<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow border-0 overflow-hidden">
            <div class="row g-0">

                <!-- Carousel: lợi ích của dịch vụ -->
                <div class="col-12 col-lg-6">
                    <div id="benefitCarousel" class="carousel slide carousel-dark h-100" data-bs-ride="carousel">
                        <div class="carousel-indicators">
                            <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="0" class="active"></button>
                            <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="1"></button>
                            <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="2"></button>
                        </div>
                        <div class="carousel-inner h-100">
                            <div class="carousel-item active h-100">
                                <img src="https://picsum.photos/id/1015/800/900" class="d-block w-100 h-100 object-fit-cover" alt="Học mọi lúc mọi nơi" style="min-height: 300px;">
                                <div class="carousel-caption bg-dark bg-opacity-50 rounded p-3">
                                    <h5><i class="fas fa-clock"></i> Học mọi lúc, mọi nơi</h5>
                                    <p class="mb-0">Truy cập nội dung 24/7 trên mọi thiết bị.</p>
                                </div>
                            </div>
                            <div class="carousel-item h-100">
                                <img src="https://picsum.photos/id/1018/800/900" class="d-block w-100 h-100 object-fit-cover" alt="Bảo mật" style="min-height: 300px;">
                                <div class="carousel-caption bg-dark bg-opacity-50 rounded p-3">
                                    <h5><i class="fas fa-shield-halved"></i> Bảo mật tuyệt đối</h5>
                                    <p class="mb-0">Thông tin của bạn luôn được bảo vệ an toàn.</p>
                                </div>
                            </div>
                            <div class="carousel-item h-100">
                                <img src="https://picsum.photos/id/1039/800/900" class="d-block w-100 h-100 object-fit-cover" alt="Ưu đãi" style="min-height: 300px;">
                                <div class="carousel-caption bg-dark bg-opacity-50 rounded p-3">
                                    <h5><i class="fas fa-gift"></i> Ưu đãi thành viên</h5>
                                    <p class="mb-0">Nhận nhiều quà tặng và giảm giá hấp dẫn.</p>
                                </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#benefitCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#benefitCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>
                    </div>
                </div>

                <!-- Form đăng ký -->
                <div class="col-12 col-lg-6">
                    <div class="p-4 p-md-5">
                        <h2 class="text-center mb-1">Đăng ký tài khoản</h2>
                        <p class="text-center text-muted mb-4">Tham gia cùng chúng tôi ngay hôm nay</p>

                        <form action="#" method="post">
                            <div class="mb-3">
                                <label for="fullname" class="form-label">Họ và tên</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirm" class="form-label">Xác nhận mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="confirm" placeholder="Nhập lại mật khẩu" required>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-user-plus"></i> Đăng ký
                                </button>
                            </div>

                            <p class="text-center text-muted mt-3 mb-0">
                                Đã có tài khoản? <a href="#">Đăng nhập</a>
                            </p>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
