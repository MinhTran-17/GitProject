<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch họp công ty</title>
</head>
<body>
    <h1>Lịch họp công ty</h1>
    <table border="1" cellpadding="8">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        <tr>
            <td rowspan="3">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>
        <tr>
            <td>10:00 - 11:00</td>
            <td>Họp phòng Kỹ thuật</td>
        </tr>
        <tr>
            <td>14:00 - 15:30</td>
            <td>Họp với khách hàng</td>
        </tr>
        <tr>
            <td rowspan="2">Thứ Tư</td>
            <td>09:00 - 10:00</td>
            <td>Họp dự án phần mềm</td>
        </tr>
        <tr>
            <td>15:00 - 16:00</td>
            <td>Đánh giá tiến độ công việc</td>
        </tr>
        <tr>
            <td>Thứ Sáu</td>
            <td colspan="2">Cả ngày (08:00 - 17:00): Hội nghị tổng kết quý</td>
        </tr>
    </table>
</body>
</html>
