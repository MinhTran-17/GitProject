<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid - SASS</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="grid-container">
    <header class="grid-wrapper grid-wrapper--header">
      <div class="grid-content grid-content--header"></div>
    </header>

    <section class="grid-wrapper grid-wrapper--body">
      <aside class="grid-content sidebar">
        <div class="sidebar__item"></div>
        <div class="sidebar__item"></div>
        <div class="sidebar__item"></div>
        <div class="sidebar__item"></div>
      </aside>

      <div class="grid-content grid-content--empty"></div>
      <div class="grid-content grid-content--empty"></div>
      <div class="grid-content grid-content--empty"></div>
      <div class="grid-content grid-content--empty"></div>
      <div class="grid-content grid-content--empty"></div>
      <div class="grid-content grid-content--empty"></div>

      <aside class="grid-content right-panel">
        <div class="right-panel__item"></div>
      </aside>
    </section>

    <footer class="grid-wrapper grid-wrapper--footer">
      <div class="grid-content grid-content--footer"></div>
    </footer>
  </main>
  <p class="help-text">Thay đổi kích thước cửa sổ trình duyệt để xem giao diện responsive.</p>
</body>
</html>
